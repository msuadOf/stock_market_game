[workspace]
resolver = "2"
members = [
    "packages/engine",
    "packages/engine-gpu",
    "apps/web-wasm",
    "apps/server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["msuad"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
ts-rs = { version = "12.0.1", features = ["format", "no-serde-warnings"] }

[profile.release]
# Keep release builds parallelizable. Fat LTO with one codegen unit turns the
# final engine compile into a minutes-long single-core job, which violates the
# repository's bounded multi-core validation policy.
lto = "thin"
codegen-units = 16
