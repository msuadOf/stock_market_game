[workspace]
resolver = "2"
members = [
    "packages/engine",
    "packages/engine-gpu",
    "packages/native-store",
    "apps/web-wasm",
    "apps/server",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["msuad"]
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings"] }
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.release]
# 保持 release 编译可并行；fat LTO 配合单个 codegen unit 会让 engine 最终编译
# 长时间只占单核，不符合仓库的多核验证与执行期限要求。
lto = "thin"
codegen-units = 16
