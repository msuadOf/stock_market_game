[package]
name = "web-wasm-diagnostic"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[features]
simulation-diagnostics = ["engine/simulation-diagnostics"]
verification-harness = ["engine/verification-harness"]
libos-upstream = ["verification-harness", "engine/libos-upstream"]
libos-worker-experiment = ["libos-upstream", "engine/libos-worker-experiment"]
[dependencies]
engine = { path = "../../../packages/engine" }
wasm-bindgen = "=0.2.93"
serde-wasm-bindgen = "0.6"
serde = {version="1",features=["derive"]}
serde_json = "1"
libm = "=0.2.16"
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
[profile.release]
lto = "thin"
codegen-units = 16
