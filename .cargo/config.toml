# 根配置保留空 rustflags；wasm32 的 +atomics/build-std 链接链由
# apps/web-wasm/.cargo/config.toml 提供（R4a 阶段 1 恢复），本文件不重复声明。
# Cargo 的 rustflags 跨目录链**合并**（非替换）；从仓库根查询 wasm32 目标不会
# 加载成员 crate 的 target 配置。线程产物验收应在 apps/web-wasm 目录构建，或经
# scripts/verify-wasm-thread-combo.mjs 统一构建。
[target.wasm32-unknown-unknown]
rustflags = []

[env]
TS_RS_EXPORT_DIR = { value = "apps/web/src/types/generated", relative = true }
TS_RS_LARGE_INT = "number"
