name: Unsigned distributions

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distributions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: Shared production UI
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup frontend Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Install pinned WASM Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Record frontend CPU budget
        run: node -e "const n=require('node:os').availableParallelism(); console.log({jobs:n}); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'CARGO_BUILD_JOBS='+n+'\nRAYON_NUM_THREADS='+n+'\n');"
      - name: Cache WASM Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          shared-key: distribution-wasm
          cache-on-failure: true
      - name: Install pinned wasm-pack after cache restore
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1
      - name: Verify wasm-pack version
        run: test "$(wasm-pack --version)" = 'wasm-pack 0.13.1'
      - name: Check distribution build contracts
        run: node scripts/run-with-deadline.mjs 10000 -- node --test --test-timeout=10000 --test-concurrency=4 --test-isolation=none scripts/build-targets.test.mjs scripts/distribution-workflow.test.mjs scripts/package-distributions.test.mjs scripts/smoke-deployment.test.mjs
      - name: Install frontend dependencies
        run: node scripts/run-long-validation.mjs 300000 -- pnpm install --frozen-lockfile
      - name: Build shared WASM
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-05
        run: node scripts/run-long-validation.mjs 300000 -- wasm-pack build apps/web-wasm --target web --release --out-dir wasm-pack-output/ci/wasm/pkg -Z build-std=panic_abort,std
      - name: Check and copy WASM
        run: |
          node scripts/check-wasm-threading.mjs apps/web-wasm/wasm-pack-output/ci/wasm/pkg/web_wasm.js
          node scripts/check-web-release-wasm.mjs apps/web-wasm/wasm-pack-output/ci/wasm/pkg
          mkdir -p apps/web/wasm-pkg
          cp -R apps/web-wasm/wasm-pack-output/ci/wasm/pkg/. apps/web/wasm-pkg/
      - name: Build shared production UI
        run: node scripts/run-long-validation.mjs 300000 -- pnpm --filter web build
      - name: Check production WASM
        run: node scripts/check-web-release-wasm.mjs apps/web/dist
      - name: Upload current-run frontend
        uses: actions/upload-artifact@v4
        with:
          name: production-frontend-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 7

  native:
    name: ${{ matrix.product }} (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        product: [desktop, webui-server]
    runs-on: ${{ matrix.os }}
    steps: &native-steps
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned native Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
      - name: Setup native UI Node
        if: matrix.product != 'server'
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Record native target and CPU budget (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          jobs=$(getconf _NPROCESSORS_ONLN)
          echo "Native target=$target; jobs=$jobs"
          echo "NATIVE_TARGET=$target" >> "$GITHUB_ENV"
          echo "CARGO_BUILD_JOBS=$jobs" >> "$GITHUB_ENV"
      - name: Record native target and CPU budget (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = (& rustc -vV | Select-String '^host: ').ToString().Substring(6)
          $jobs = [Environment]::ProcessorCount
          Write-Host "Native target=$target; jobs=$jobs"
          "NATIVE_TARGET=$target" >> $env:GITHUB_ENV
          "CARGO_BUILD_JOBS=$jobs" >> $env:GITHUB_ENV
      - name: Restore native compile cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/build-cache/${{ matrix.product }}
          key: distribution-native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.product }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'packages/*/Cargo.toml', 'apps/*/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            distribution-native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.product }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml', '.cargo/config.toml', 'packages/*/Cargo.toml', 'apps/*/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml') }}-
            distribution-native-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.product }}-
      - name: Download current-run frontend
        if: matrix.product != 'server'
        uses: actions/download-artifact@v4
        with:
          name: production-frontend-${{ github.sha }}
          path: target/ci-frontend
      - name: Install Desktop dependencies (Linux)
        if: matrix.product == 'desktop' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2t64 rpm xdg-utils
      - name: Install no-Node Server build tools (macOS)
        if: matrix.product == 'server' && runner.os == 'macOS'
        run: brew install coreutils
      - name: Install pinned Tauri CLI
        if: matrix.product == 'desktop'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tauri-cli"
          mkdir -p "$tools"
          case "$RUNNER_OS" in
            Linux) extension=tgz ;;
            Windows|macOS) extension=zip ;;
            *) echo 'Unsupported native Tauri platform' >&2; exit 1 ;;
          esac
          gh release download tauri-cli-v2.12.1 --repo tauri-apps/tauri --pattern "cargo-tauri-${NATIVE_TARGET}.${extension}" --dir "$tools"
          if [ "$extension" = zip ]; then unzip "$tools/"*.zip -d "$tools"; else tar -xzf "$tools/"*.tgz -C "$tools"; fi
          echo "$tools" >> "$GITHUB_PATH"
          "$tools/cargo-tauri" --version
      - name: Build pure Server (Unix, no Node build)
        if: matrix.product == 'server' && runner.os != 'Windows'
        run: bash scripts/build.sh server --jobs "$CARGO_BUILD_JOBS"
      - name: Build pure Server (Windows, no Node build)
        if: matrix.product == 'server' && runner.os == 'Windows'
        shell: cmd
        run: scripts\build.bat server --jobs %CARGO_BUILD_JOBS%
      - name: Prepare desktop engine compile cache
        if: matrix.product == 'desktop'
        env:
          CARGO_TARGET_DIR: target/build-cache/desktop
        run: node scripts/run-long-validation.mjs 300000 -- cargo build --locked --release -p engine --lib --jobs ${{ env.CARGO_BUILD_JOBS }} --target ${{ env.NATIVE_TARGET }}
      - name: Build native UI product with prebuilt frontend
        if: matrix.product != 'server'
        run: node scripts/build-targets.mjs ${{ matrix.product }} --frontend-dist target/ci-frontend --jobs ${{ env.CARGO_BUILD_JOBS }}
      - name: Save native compile cache even after a bounded build failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/build-cache/${{ matrix.product }}
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Smoke native deployment (no game regression)
        if: matrix.product != 'desktop'
        run: node scripts/run-with-deadline.mjs 10000 -- node scripts/smoke-deployment.mjs ${{ matrix.product }} --input target/build-artifacts/${{ matrix.product }}
      - name: Package unsigned distributions
        run: node scripts/run-long-validation.mjs 300000 -- node scripts/package-distributions.mjs ${{ matrix.product }} --input target/build-artifacts/${{ matrix.product }} --output target/distributions/${{ matrix.product }} --target ${{ env.NATIVE_TARGET }}
      - name: Upload unsigned native distributions
        uses: actions/upload-artifact@v4
        with:
          name: stock-market-game-${{ matrix.product }}-${{ env.NATIVE_TARGET }}-unsigned
          path: target/distributions/${{ matrix.product }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  server:
    name: ${{ matrix.product }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
        product: [server]
    runs-on: ${{ matrix.os }}
    steps: *native-steps
