name: CI

# CI：Windows + Ubuntu 双平台，验证 engine / WASM / 前端 / 后端 全链路可编译。
# 触发：push 到任意分支、任意 PR。Tauri 桌面构建因平台依赖较重，留作本地脚本。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # ---- 检出代码 -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 安装 Rust 工具链 ----------------------------------------
      # engine 的 test / clippy 走 stable（无需 nightly，避免装 nightly clippy 拖慢 CI）。
      - name: Install pinned Rust (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      # WASM 多核构建使用固定 nightly-2026-09-05，兼容 Edition 2024 依赖。
      # 根 `.cargo/config.toml` 显式导出当前 nightly 的 TLS/堆线程初始化符号。
      - name: Install pinned nightly-2026-09-05 (WASM only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05

      # wasm-bindgen-rayon 的 +atomics 需要走 build-std → 要 wasm32 target + rust-src。
      - name: Add wasm32 target + rust-src (pinned nightly)
        run: |
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-09-05
          rustup component add rust-src --toolchain nightly-2026-09-05

      # ---- 安装 wasm-pack ------------------------------------------
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      # ---- 安装 Node + pnpm ----------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      # ---- 缓存 cargo ----------------------------------------------
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      # ---- 缓存 pnpm -----------------------------------------------
      - name: Get pnpm store dir
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ---- Linux 专属：Tauri(webkit2gtk) 系统依赖 -----------------
      # server 用不到，但保持与本地 build.sh 一致的构建环境；避免日后加桌面步骤时 link 失败。
      - name: Install Tauri system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # =============================================================
      # 1) Rust 格式、全工作区测试与静态检查
      # =============================================================
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: Check generated Rust -> TypeScript bindings
        run: node scripts/check-generated-types.mjs

      # =============================================================
      # 2) engine clippy（警告即错误）
      # =============================================================
      - name: cargo clippy --workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      # =============================================================
      # 3) WASM 构建（pinned nightly-2026-09-05 + wasm-bindgen-rayon）
      #    build-std=panic_abort,std 是 wasm-bindgen-rayon +atomics 的硬性要求。
      # =============================================================
      - name: wasm-pack build (web-wasm)
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-09-05
        run: wasm-pack build apps/web-wasm --target web --release -Z build-std=panic_abort,std

      - name: Verify WASM shared-memory threading contract
        run: node scripts/check-wasm-threading.mjs

      # =============================================================
      # 4) 复制 wasm 产物到前端消费目录
      #    Windows 用 xcopy，Linux/macOS 用 cp。
      # =============================================================
      - name: Copy wasm pkg -> apps/web/wasm-pkg (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if not exist "apps\web\wasm-pkg" mkdir "apps\web\wasm-pkg"
          xcopy /e /y /i /q "apps\web-wasm\pkg\*" "apps\web\wasm-pkg\" >nul

      - name: Copy wasm pkg -> apps/web/wasm-pkg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p apps/web/wasm-pkg
          cp -r apps/web-wasm/pkg/* apps/web/wasm-pkg/

      - name: Verify copied WASM shared-memory threading contract
        run: node scripts/check-wasm-threading.mjs apps/web/wasm-pkg/web_wasm.js

      # =============================================================
      # 5) 前端依赖 + 构建
      # =============================================================
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: pnpm --filter web build
        run: pnpm --filter web build

      - name: pnpm --filter web test
        run: pnpm --filter web test

      - name: pnpm --filter web lint
        run: pnpm --filter web lint

      - name: Install Playwright Chromium (Linux only)
        if: runner.os == 'Linux'
        run: pnpm --filter web exec playwright install chromium

      - name: Browser E2E (Linux only)
        if: runner.os == 'Linux'
        run: pnpm --filter web test:e2e

      # =============================================================
      # 6) 后端构建（release）
      # =============================================================
      - name: cargo build -p server --release
        run: cargo build -p server --release
