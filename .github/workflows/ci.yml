name: CI

# CI：Windows + Ubuntu 双平台，验证 engine / WASM / 前端 / 后端 全链路可编译。
# 手动或标签发布调用；普通提交和 PR 不自动执行，回归门禁仍保留。

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Windows links dozens of test binaries; full PDBs exhaust the build deadline.
  # Keep debug assertions/overflow checks and every test, omit symbols only.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  prune-caches:
    name: Prune superseded compile caches
    needs: build
    if: always() && !cancelled() && github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    concurrency:
      group: actions-cache-prune
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup cleanup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Test cache retention and workflow contracts
        run: node scripts/run-with-deadline.mjs 10000 -- node --test --test-timeout=10000 --test-concurrency=4 scripts/prune-actions-cache.test.mjs scripts/cache-workflow.test.mjs
      - name: Remove superseded cache snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          STOCK_PRUNE_RELEASE_CACHES: "true"
        run: node scripts/run-long-validation.mjs 300000 -- node scripts/prune-actions-cache.mjs --repo ${{ github.repository }} --apply

  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      # ---- 检出代码 -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 安装 Rust 工具链 ----------------------------------------
      # engine 的 test / clippy 走 stable（无需 nightly，避免装 nightly clippy 拖慢 CI）。
      - name: Install pinned Rust (with clippy + rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1
          components: clippy, rustfmt

      # WASM 多核构建使用固定 nightly-2026-09-05，兼容 Edition 2024 依赖。
      # 根 `.cargo/config.toml` 显式导出当前 nightly 的 TLS/堆线程初始化符号。
      - name: Install pinned nightly-2026-09-05 (WASM only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05

      # wasm-bindgen-rayon 的 +atomics 需要走 build-std → 要 wasm32 target + rust-src。
      - name: Add wasm32 target + rust-src (pinned nightly)
        run: |
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-09-05
          rustup component add rust-src --toolchain nightly-2026-09-05

      # ---- 安装 Node + 固定 pnpm（测试进程直接由 Node 启动）----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Record available CPU budget
        run: |
          node -e "const os = require('node:os'); const fs = require('node:fs'); const cpus = os.availableParallelism(); console.log(JSON.stringify({available_cpu_count: cpus, reported_logical_cpu_count: os.cpus().length})); fs.appendFileSync(process.env.GITHUB_ENV, 'CARGO_BUILD_JOBS=' + cpus + '\n');"

      - name: Check CI workflow regression contracts
        run: node scripts/run-with-deadline.mjs 10000 -- node --test --test-timeout=10000 --test-concurrency=4 scripts/ci-workflow.test.mjs scripts/frontend-build.test.mjs scripts/run-long-validation.test.mjs

      - name: Setup pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      # ---- 缓存 cargo ----------------------------------------------
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
          cache-on-failure: true

      # Fixed version: "latest" can resolve an old release without build-std support.
      # Install after restoring Cargo binaries so a cache cannot replace this tool.
      - name: Install pinned wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Verify wasm-pack version
        run: node -e "const {execFileSync} = require('node:child_process'); const version = execFileSync('wasm-pack', ['--version'], {encoding:'utf8'}).trim(); console.log(version); if (version !== 'wasm-pack 0.13.1') throw new Error('Expected wasm-pack 0.13.1, got ' + version);"

      # ---- 缓存 pnpm -----------------------------------------------
      - name: Get pnpm store dir
        id: pnpm-store
        run: echo "dir=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        shell: bash

      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ---- Linux 专属：Tauri(webkit2gtk) 系统依赖 -----------------
      # server 用不到，但保持与本地 build.sh 一致的构建环境；避免日后加桌面步骤时 link 失败。
      - name: Install Tauri system deps (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # =============================================================
      # 1) Rust 格式检查
      # =============================================================
      - name: cargo fmt --check
        run: cargo fmt --all --check

      # =============================================================
      # 2) 共享前端构建；依赖、WASM、复制、校验与 UI 编译均由脚本负责。
      # =============================================================
      - name: Build shared production UI
        run: node scripts/frontend-build.mjs --jobs ${{ env.CARGO_BUILD_JOBS }}

      # =============================================================
      # 5) 密封两阶段全回归与 Rust 静态检查
      # =============================================================
      # 每轮保存新的 Cargo 缓存，失败构建也能留下已完成编译的产物。
      # 缓存只用于加速；源码绑定、构建与验收仍须在本轮实际执行。
      - name: Restore sealed Cargo cache
        id: sealed-cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: .tmp/build-cache/full-regression
          key: sealed-cargo-v2-no-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'Cargo.toml', 'packages/*/Cargo.toml', 'apps/*/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sealed-cargo-v2-no-debug-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'Cargo.lock', 'Cargo.toml', 'packages/*/Cargo.toml', 'apps/*/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml') }}-
            sealed-cargo-v2-no-debug-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Windows native libraries (separate 5 minute compile deadline)
        id: native-prepare
        if: runner.os == 'Windows'
        run: node scripts/run-long-validation.mjs 300000 -- cargo build --workspace --lib --target-dir .tmp/build-cache/full-regression --jobs ${{ env.CARGO_BUILD_JOBS }}

      - name: Build sealed full-regression artifacts (5 minute deadline)
        id: sealed-build
        run: node scripts/run-full-regression.mjs build --inventory .tmp/full-regression/ci-inventory.json

      - name: Check sealed Cargo cache directory
        id: sealed-cache-ready
        if: always() && (steps.sealed-build.outcome == 'success' || steps.sealed-build.outcome == 'failure' || steps.native-prepare.outcome == 'success' || steps.native-prepare.outcome == 'failure')
        run: node -e "const fs = require('node:fs'); const p = '.tmp/build-cache/full-regression'; fs.appendFileSync(process.env.GITHUB_OUTPUT, 'exists=' + (fs.statSync(p, {throwIfNoEntry:false})?.isDirectory() === true) + '\n');"

      - name: Save sealed Cargo cache
        if: always() && steps.sealed-cache-ready.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: .tmp/build-cache/full-regression
          key: ${{ steps.sealed-cargo-cache.outputs.cache-primary-key }}

      - name: Execute sealed full regression (5 minute deadline)
        run: node scripts/run-full-regression.mjs execute --inventory .tmp/full-regression/ci-inventory.json

      # Cargo has fetched the locked dependency graph during the native and WASM builds.
      - name: Check native and WASM dependency separation
        run: node scripts/run-with-deadline.mjs 10000 -- node --test --test-timeout=10000 --test-isolation=none scripts/wasm-build-dependencies.test.mjs

      # ts-rs exports during Rust tests; checking a clean checkout before those
      # tests cannot detect committed but stale TypeScript bindings.
      - name: Check generated Rust -> TypeScript bindings
        run: node scripts/check-generated-types.mjs

      - name: cargo clippy --workspace
        run: node scripts/run-long-validation.mjs 300000 -- cargo clippy --workspace --all-targets -- -D warnings

      # =============================================================
      # 6) 前端静态检查与浏览器验收
      # =============================================================
      - name: pnpm --filter web lint
        run: pnpm --filter web lint

      - name: Install Playwright Chromium (Linux only)
        if: runner.os == 'Linux'
        run: pnpm --filter web exec playwright install chromium

      - name: Browser E2E (Linux only)
        if: runner.os == 'Linux'
        run: node scripts/run-long-validation.mjs 300000 -- pnpm --filter web test:e2e

      # =============================================================
      # 7) 后端构建（release）
      # =============================================================
      - name: Build pure Server (Unix, no Node build)
        if: runner.os != 'Windows'
        run: bash scripts/build.sh server --jobs "$CARGO_BUILD_JOBS"
      - name: Build pure Server (Windows, no Node build)
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\build.bat server --jobs %CARGO_BUILD_JOBS%
